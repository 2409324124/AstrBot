version: '3.8'

# When connecting to OneBot v11 Napcat, please use this compose file for one-click deployment: https://github.com/NapNeko/NapCat-Docker/blob/main/compose/astrbot.yml

services:
  astrbot:
    image: ${ASTRBOT_IMAGE:?ASTRBOT_IMAGE must be a pinned tag or digest}
    container_name: astrbot
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:6185:6185" # AstrBot WebUI
      - "127.0.0.1:6199:6199" # OneBot v11 reverse WebSocket for host-network NapCat
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/AstrBot/data
      # - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
